name: CI Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  USE_LOCAL_DB: true
  E2E_LOCAL: true
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality-check:
    name: Fast Quality Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Reject production env files
        run: test ! -f .env
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node22-build-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm lint
      - run: pnpm test:offline
      - name: Build all apps without Cloud credentials
        run: pnpm build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: local-ci-build-only
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: local-ci-build-only
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-build-only
          CUSTOMER_APP_URL: http://127.0.0.1:5173
          MERCHANT_APP_URL: http://127.0.0.1:5174

  database-integration:
    name: Docker Supabase Integration Tests
    needs: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Reject production env files
        run: test ! -f .env
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Start Docker Supabase and configure local tests
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase status -o json | node scripts/ci-local-env.mjs
      - run: pnpm test:local
      - name: Stop Docker Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-playwright:
    name: E2E Playwright Tests
    needs: database-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Reject production env files
        run: test ! -f .env
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install chromium --with-deps
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Start Docker Supabase and configure local tests
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase status -o json | node scripts/ci-local-env.mjs
      - run: pnpm test:e2e
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Docker Supabase
        if: always()
        run: supabase stop --no-backup

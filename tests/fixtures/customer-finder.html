<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
import '@gosavingfood/ui/tokens.css';
import '@gosavingfood/ui/components.css';
import '/src/index.css';
import { FinderPage } from '/src/features/finder/pages/FinderPage.tsx';
import { TodayDeals } from '/src/features/home/components/TodayDeals.tsx';
const merchant = { id:'qa-store', catalogSource:'demo', name:'Tiệm QA Dịch Vọng (demo)', description:'Dữ liệu giả lập', phone:'', address:'Dịch Vọng, Hà Nội', logo:'', banner:'', rating:0, totalRatings:0, distance:34, latitude:21.030306, longitude:105.78, status:'active', isOpen:true, openingHours:'00:00–23:59' };
const base = { catalogSource:'demo', merchantId:'qa-store', merchantName:merchant.name, description:'Dữ liệu thử nghiệm', originalPrice:80000, discountPrice:30000, category:'bakery', imageUrl:'/explore/qa-missing-image.png', quantity:3, maxQuantity:3, pickupStart:'00:00', pickupEnd:'23:59', bagType:'daily', isAvailable:true, status:'active', expiresAt:'2099-12-31T16:59:59Z', rating:0 };
